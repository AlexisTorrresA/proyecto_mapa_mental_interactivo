version: 1
name: mapa-mental
image: ghcr.io/alexistorrresa/mapa-mental:main
container_name: y700-mapa-mental
container_port: 8501
command:
  - /bin/sh
  - -c
  - >-
    python scripts/init_db.py &&
    exec streamlit run mapa_mental.py
    --server.port=8501
    --server.address=0.0.0.0
    --server.headless=true
public:
  enabled: true
  subdomain: mapa-mental-ia
healthcheck:
  path: /_stcore/health
database:
  postgres: true
  name: mapa_mental_ia
secrets:
  required: []
  optional:
    - MAPA_ADMIN_PASSWORD
resources:
  memory: 1g
  cpus: 1.25
